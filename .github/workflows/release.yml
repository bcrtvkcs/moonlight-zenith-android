name: Release APKs

on:
  push:
    tags:
      - 'v*-zenith*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (leave empty to use latest *zenith* tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Verify signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required repository secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add all 4 signing secrets in Settings -> Secrets and variables -> Actions before creating a release."
            exit 1
          fi

      - name: Checkout repository with submodules and full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            TAG_NAME="$(git describe --tags --match='*zenith*' --abbrev=0)"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "::error::Could not determine release tag."
            exit 1
          fi

          IS_PRERELEASE="false"
          if echo "$TAG_NAME" | grep -qiE '-(alpha|beta|rc)'; then
            IS_PRERELEASE="true"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG_NAME (prerelease=$IS_PRERELEASE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure preinstalled Android SDK & install NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Using preinstalled sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;30.0.16248370"
          "$SDKMANAGER" --install "platforms;android-37" || "$SDKMANAGER" --channel=3 --install "platforms;android-37" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs (nonRoot & root)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleNonRootRelease :app:assembleRootRelease --no-daemon --stacktrace

      - name: Package, verify signatures, and generate checksums
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          OUT_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$OUT_DIR"

          NONROOT_APK="app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk"
          ROOT_APK="app/build/outputs/apk/root/release/app-root-release.apk"

          if [ ! -f "$NONROOT_APK" ]; then
            echo "::error::Expected APK not found: $NONROOT_APK"
            exit 1
          fi
          if [ ! -f "$ROOT_APK" ]; then
            echo "::error::Expected APK not found: $ROOT_APK"
            exit 1
          fi

          OUT_NONROOT="$OUT_DIR/Moonlight-Zenith-${TAG_NAME}-nonRoot-release.apk"
          OUT_ROOT="$OUT_DIR/Moonlight-Zenith-${TAG_NAME}-root-release.apk"

          cp "$NONROOT_APK" "$OUT_NONROOT"
          cp "$ROOT_APK" "$OUT_ROOT"

          APKSIGNER="$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying APK signatures with $APKSIGNER..."
            "$APKSIGNER" verify --print-certs "$OUT_NONROOT"
            "$APKSIGNER" verify --print-certs "$OUT_ROOT"
          fi

          (
            cd "$OUT_DIR"
            sha256sum *.apk > SHA256SUMS.txt
          )

          ls -lh "$OUT_DIR"
          cat "$OUT_DIR/SHA256SUMS.txt"

      - name: Extract release notes from changelog.md
        id: notes
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          python3 - "$TAG_NAME" "$NOTES_FILE" <<'PY'
          import os, re, sys

          tag = sys.argv[1]
          out_path = sys.argv[2]

          changelog_path = None
          for candidate in ("changelog.md", "CHANGELOG.md", "Changelog.md"):
              if os.path.exists(candidate):
                  changelog_path = candidate
                  break

          if changelog_path is None:
              sys.exit(0)

          with open(changelog_path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          header_re = re.compile(r'^##\s+\[?' + re.escape(tag) + r'\]?(?:\s|$)')
          start_idx = None
          for i, line in enumerate(lines):
              if header_re.match(line.strip()):
                  start_idx = i + 1
                  break

          if start_idx is None:
              print(f"No matching section for {tag} found in {changelog_path}; will use auto-generated release notes.")
              sys.exit(0)

          collected = []
          for line in lines[start_idx:]:
              stripped = line.strip()
              if stripped == "---" or re.match(r'^##\s+', stripped):
                  break
              collected.append(line)

          body = "".join(collected).strip()
          if body:
              with open(out_path, "w", encoding="utf-8") as out:
                  out.write(body + "\n")
              print(f"Extracted release notes for {tag} from {changelog_path} ({len(body)} chars).")
          PY

          if [ -s "$NOTES_FILE" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release (with changelog.md notes)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Moonlight Zenith ${{ steps.tag.outputs.tag_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          draft: false
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
          files: |
            ${{ runner.temp }}/release-assets/*.apk
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release (auto-generated notes fallback)
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Moonlight Zenith ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
          files: |
            ${{ runner.temp }}/release-assets/*.apk
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt

      - name: Upload release assets as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: moonlight-zenith-release-${{ steps.tag.outputs.tag_name }}
          path: ${{ runner.temp }}/release-assets/*
          retention-days: 30
